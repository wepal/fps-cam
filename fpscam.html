<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Framerate Camera</title>
<style>
/* Layout: The camera image fills the window, with glass controls floating above it (camera app style). */
:root{
  --bg:#000; --fg:#f5f5f2; --dim:rgba(245,245,242,.62);
  --glass:rgba(32,32,34,.58); --line:rgba(255,255,255,.16);
  --rec:#ff453a; --accent:#ffd60a;
  --sai-t:env(safe-area-inset-top,0px); --sai-b:env(safe-area-inset-bottom,0px);
  --sai-l:env(safe-area-inset-left,0px); --sai-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

.view{position:fixed;inset:0;overflow:hidden;background:#000}
video.fill{position:absolute;inset:0;width:100%;height:100%;background:#000}
canvas.fill{position:absolute;inset:0;width:100%;height:100%;background:#000;display:block}
#live{object-fit:cover;display:none}
#preview{object-fit:cover}
#live.mirror{transform:scaleX(-1)}
#preview.mirror{transform:scaleX(-1)}
#player{object-fit:contain}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.4}

/* Camera view */
.top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(12px + var(--sai-t)) max(16px,var(--sai-r)) 0 max(16px,var(--sai-l));pointer-events:none}
.top>*{pointer-events:auto}
.top .end{justify-self:end}
.badge{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:600;letter-spacing:.02em}
.badge .dot{width:10px;height:10px;border-radius:50%;background:var(--rec)}
.badge .sub{color:var(--dim);font-weight:500}

.bottom{position:absolute;left:0;right:0;bottom:0;
  padding:48px max(20px,var(--sai-r)) calc(22px + var(--sai-b)) max(20px,var(--sai-l));
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent)}
.bar{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bar>:first-child{justify-self:start}
.bar>:last-child{justify-self:end}

.shutter{width:80px;height:80px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter::before{content:"";width:62px;height:62px;border-radius:50%;background:var(--rec);transition:width .18s,height .18s,border-radius .18s}
.shutter:active::before{transform:scale(.92)}
.shutter:disabled{opacity:.5}
#app[data-rec="1"] .shutter::before{width:30px;height:30px;border-radius:8px}

.thumb{width:56px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.07) center/cover no-repeat;
  display:grid;place-items:center;overflow:hidden}
.thumb svg{width:24px;height:24px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.thumb.has{border-color:#fff}
.thumb:disabled{opacity:.45}
.thumb.has:disabled{opacity:.7}

.fpsbtn{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1}
.fpsbtn b{font-size:17px;color:var(--accent);font-weight:700}
.fpsbtn small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.fpsbtn:disabled{opacity:.4}

/* Frame rate selection */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.card{width:min(460px,calc(100% - 24px));margin-bottom:calc(12px + var(--sai-b));padding:18px 20px 18px;border-radius:26px;
  background:rgba(28,28,30,.82);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line)}
.sheet:not([hidden]) .card{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.done{color:var(--accent);font-weight:600;padding:8px 4px}
.readout{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 4px}
.readout .num{min-width:2.3ch;text-align:center;font-size:64px;font-weight:700;line-height:1}
.readout .unit{font-size:15px;color:var(--dim);margin-left:-10px;align-self:flex-end;padding-bottom:10px}
.step{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.step svg{width:22px;height:22px}
.step:disabled{opacity:.3}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 10px}
.chip{padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:#000}
.info{margin:10px 0 0;color:var(--dim);font-size:13.5px;min-height:3em;text-align:center;text-wrap:balance}
.info strong{color:var(--fg);font-weight:600}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),rgba(255,255,255,.28) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 5px rgba(0,0,0,.45)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}

/* Playback */
#playerView{z-index:10}
#playerView .ui{transition:opacity .25s}
#playerView:not(.show) .ui{opacity:0;pointer-events:none}
.ptop{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(12px + var(--sai-t)) max(16px,var(--sai-r)) 40px max(16px,var(--sai-l));background:linear-gradient(rgba(0,0,0,.5),transparent)}
.ptop .end{justify-self:end}
.pinfo{padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.55);font-weight:600;font-size:14px}
.pinfo span{color:var(--accent)}
.pbottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:56px max(20px,var(--sai-r)) calc(22px + var(--sai-b)) max(20px,var(--sai-l));background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}
.seekrow{display:flex;align-items:center;gap:12px;width:min(640px,100%);font-size:13px;color:var(--dim)}
.seekrow span{min-width:3.2ch;text-align:center}
.big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center}
.big svg{width:30px;height:30px}

/* Meldungen */
.gate{z-index:30;display:grid;place-items:center;padding:24px;text-align:center}
.gate p{max-width:34ch;margin:0 auto 18px;color:var(--dim);font-size:16px;text-wrap:balance}
.pill{padding:12px 22px;border-radius:999px;background:var(--fg);color:#000;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--sai-b));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:14px;background:rgba(40,40,42,.92);border:1px solid var(--line);text-align:center;font-size:14px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sheet:not([hidden]) .card{animation:none}.shutter::before{transition:none}}
</style>
</head>
<body>
<div id="app" class="view" data-rec="0">
  <video id="live" class="fill" playsinline muted autoplay></video>

  <div class="top">
    <div></div>
    <div id="badge" class="badge" hidden aria-live="off"><span id="dot" class="dot"></span><span id="timer">0:00</span><span class="sub" id="badgeFps"></span></div>
    <button id="flipBtn" class="icon-btn glass end" aria-label="Switch camera" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4M4 5v3h3M4 13a8 8 0 0 0 14.5 4M20 19v-3h-3"/></svg>
    </button>
  </div>

  <div class="bottom">
    <div class="bar">
      <button id="thumbBtn" class="thumb" disabled aria-label="Play latest recording">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="#fff"/></svg>
      </button>
      <button id="recBtn" class="shutter" aria-label="Start recording" disabled></button>
      <button id="fpsBtn" class="fpsbtn glass" aria-label="Set frame rate"><b id="fpsVal">15</b><small>fps</small></button>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="card" role="dialog" aria-label="Frame rate">
      <div class="card-head"><h2>Frame rate</h2><button id="sheetClose" class="done">Done</button></div>
      <div class="readout">
        <button id="decBtn" class="step" aria-label="Decrease frame rate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <div class="num" id="sheetNum">15</div><div class="unit">fps</div>
        <button id="incBtn" class="step" aria-label="Increase frame rate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
      <input id="fpsRange" type="range" min="1" max="30" step="1" value="15" aria-label="Frame rate in frames per second">
      <div class="presets" id="presets"></div>
      <p class="info" id="fpsInfo"></p>
    </div>
  </div>

  <div id="playerView" class="view" hidden>
    <video id="player" class="fill" playsinline></video>
    <div class="ptop ui">
      <button id="pClose" class="icon-btn glass" aria-label="Back to camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="pinfo" id="pInfo"></div>
      <button id="pSave" class="icon-btn glass end" aria-label="Save video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></button>
    </div>
    <div class="pbottom ui">
      <div class="seekrow"><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position"><span id="tDur">0:00</span></div>
      <button id="ppBtn" class="big glass" aria-label="Playback">
        <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        <svg id="icoPause" viewBox="0 0 24 24" hidden><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div id="gate" class="view gate" hidden><div><p id="gateMsg"></p><button id="gateBtn" class="pill">Allow camera</button></div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const app=$('app'), live=$('live'), player=$('player'), pv=$('playerView');
const recBtn=$('recBtn'), fpsBtn=$('fpsBtn'), fpsVal=$('fpsVal'), thumbBtn=$('thumbBtn'), flipBtn=$('flipBtn');
const badge=$('badge'), dot=$('dot'), timerEl=$('timer'), badgeFps=$('badgeFps');
const sheet=$('sheet'), sheetNum=$('sheetNum'), fpsRange=$('fpsRange'), fpsInfo=$('fpsInfo'), presetsEl=$('presets');
const gate=$('gate'), gateMsg=$('gateMsg'), gateBtn=$('gateBtn'), toastEl=$('toast');
const seek=$('seek'), tCur=$('tCur'), tDur=$('tDur'), ppBtn=$('ppBtn'), pInfo=$('pInfo');

const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{alpha:false});
const previewCanvas=document.createElement('canvas');
const previewCtx=previewCanvas.getContext('2d',{alpha:false});
previewCanvas.classList.add('fill');
previewCanvas.id='preview';
app.insertBefore(previewCanvas, live);
live.style.display='none';
const nf1=new Intl.NumberFormat('en-US',{maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const hasRVFC='requestVideoFrameCallback' in HTMLVideoElement.prototype;

function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let state='live';            // live | recording | stopping | playback
let stream=null, vtrack=null, camFps=30, multiCam=false;
let target=Math.min(30,Math.max(1,Math.round(+lsGet('fps',15)||15)));
let lastRec=null, rec=null, recorder=null, timerId=0, wake=null, crop=null;
let previewLast=null;

/* ---------- Helpers ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const even=x=>Math.max(2,Math.round(x/2)*2);
const fmtTime=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60);return m+':'+String(Math.floor(s%60)).padStart(2,'0')};
let toastT=0;
function toast(msg,ms=2800){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,ms)}
function snapFps(x){for(const k of [5,10,12,15,20,24,25,30,48,50,60,90,120]){if(Math.abs(x-k)/k<0.08)return k}return Math.max(1,Math.round(x))}

/* Closest possible frame rate: take every nth camera frame (camFps / n). */
function plan(t){
  const c=camFps, lo=Math.max(1,Math.floor(c/t)), hi=lo+1;
  const n=Math.abs(c/lo-t)<=Math.abs(c/hi-t)?lo:hi;
  const fps=c/n;
  return {n,fps,exact:Math.abs(fps-t)<0.005};
}

function updateFpsUI(){
  const p=plan(target);
  fpsVal.textContent=nf1.format(p.fps);
  sheetNum.textContent=target;
  fpsRange.value=target;
  fpsRange.style.setProperty('--p',((target-1)/29*100)+'%');
  $('decBtn').disabled=target<=1; $('incBtn').disabled=target>=30;
  presetsEl.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.fps===target)));
  const cam=`Camera: ${nf2.format(camFps)} frames/s`;
  let txt;
  if(p.n===1&&p.exact) txt=`Every camera frame is recorded (${cam}).`;
  else if(p.exact) txt=`Every <strong>${p.n}th</strong> frame is recorded (${cam}).`;
  else if(p.n===1) txt=`${target} fps is not possible with this camera (${cam}). Recording at <strong>${nf2.format(p.fps)} fps</strong>.`;
  else txt=`${target} fps cannot be reached exactly with this camera (${cam}). Recording at <strong>${nf2.format(p.fps)} fps</strong> (every ${p.n}th frame).`;
  fpsInfo.innerHTML=txt;
}
function setTarget(v){
  target=Math.min(30,Math.max(1,Math.round(v)));
  lsSet('fps',target); updateFpsUI();
}

function sync(){
  const recording=state==='recording'||state==='stopping';
  app.dataset.rec=recording?'1':'0';
  recBtn.setAttribute('aria-label',recording?'Stop recording':'Start recording');
  recBtn.disabled=state==='stopping'||!stream;
  fpsBtn.disabled=recording;
  thumbBtn.disabled=recording||!lastRec;
  flipBtn.disabled=recording; flipBtn.hidden=!multiCam;
  badge.hidden=!recording;
}

/* ---------- Camera ---------- */
function camError(e){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return 'Camera access is not available here. Open the page over https:// or http://localhost.';
  switch(e&&e.name){
    case 'NotAllowedError': case 'SecurityError': return 'Camera access denied. Allow camera access in your browser settings and try again.';
    case 'NotFoundError': case 'OverconstrainedError': return 'No camera was found.';
    case 'NotReadableError': return 'The camera is currently being used by another app.';
    default: return 'The camera could not be started.';
  }
}
function showGate(msg){gateMsg.textContent=msg;gate.hidden=false}
function stopStream(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;vtrack=null;previewLast=null}

async function startCamera(o={}){
  stopStream(); sync();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no-media');
  const v={width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}};
  if(o.deviceId) v.deviceId={exact:o.deviceId}; else if(o.facing) v.facingMode={ideal:o.facing};
  let s;
  try{ s=await navigator.mediaDevices.getUserMedia({video:v,audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ s=await navigator.mediaDevices.getUserMedia({video:v,audio:false}); }  // Continue without a microphone.
  stream=s; vtrack=s.getVideoTracks()[0];
  live.srcObject=s;
  try{await live.play()}catch(e){}
  const st=vtrack.getSettings();
  const isMirror=st.facingMode?st.facingMode==='user':true;
  live.classList.toggle('mirror',isMirror);
  previewCanvas.classList.toggle('mirror',isMirror);
  camFps=snapFps(st.frameRate||30); ms={t:0,i:0}; updateFpsUI();
  vtrack.addEventListener('ended',()=>{
    if(state==='recording') stopRecording();
    showGate('The camera was disconnected.');
  });
  gate.hidden=true;
  startLoop(); sync();
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    multiCam=devs.filter(d=>d.kind==='videoinput').length>1;
  }catch(e){multiCam=false}
  sync();
}
async function initCamera(o){
  try{await startCamera(o)}catch(e){showGate(camError(e));sync()}
}
async function flipCamera(){
  if(state!=='live'||!vtrack) return;
  try{
    const st=vtrack.getSettings();
    if(st.facingMode){
      await startCamera({facing:st.facingMode==='user'?'environment':'user'});
    }else{
      const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      const i=devs.findIndex(d=>d.deviceId===st.deviceId);
      await startCamera({deviceId:devs[(i+1)%devs.length].deviceId});
    }
  }catch(e){toast('Unable to switch camera.');initCamera()}
}

/* ---------- Frames: count every camera frame and take every nth one ---------- */
let loopOn=false, ms={t:0,i:0};
function measure(now,idx){
  if(!ms.t){ms={t:now,i:idx};return}
  const dt=now-ms.t; if(dt<1500)return;
  const fps=(idx-ms.i)/(dt/1000); ms={t:now,i:idx};
  if(state==='live'&&fps>=1&&fps<=240){
    const s=snapFps(fps);
    if(s!==camFps&&Math.abs(fps-camFps)/camFps>=0.08){camFps=s;updateFpsUI()}
  }
}
function onFrame(now,idx){
  if(hasRVFC) measure(now,idx);
  if(state==='recording') handleFrame(idx);
  if(state==='live'||state==='recording') drawPreview(idx);
}
function drawPreview(idx){
  const p=plan(target);
  if(previewLast!==null&&idx-previewLast<p.n) return;
  previewLast=idx;
  if(!live.videoWidth) return;
  previewCanvas.width=live.videoWidth;
  previewCanvas.height=live.videoHeight;
  previewCtx.drawImage(live,0,0);
}
function startLoop(){
  if(loopOn)return; loopOn=true;
  if(hasRVFC){
    const cb=(now,meta)=>{onFrame(now,meta.presentedFrames);live.requestVideoFrameCallback(cb)};
    live.requestVideoFrameCallback(cb);
  }else{
    const t0=performance.now();
    const tick=now=>{onFrame(now,Math.floor((now-t0)/1000*camFps));requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
  }
}

/* ---------- Recording ---------- */
function computeCrop(){
  // Record exactly the crop shown by the preview in the window.
  const vw=live.videoWidth, vh=live.videoHeight, r=previewCanvas.getBoundingClientRect();
  const sc=Math.max(r.width/vw,r.height/vh);
  const sw=Math.min(vw,r.width/sc), sh=Math.min(vh,r.height/sc);
  const k=Math.min(1,1920/Math.max(sw,sh));
  return {sx:(vw-sw)/2,sy:(vh-sh)/2,sw,sh,cw:even(sw*k),ch:even(sh*k)};
}
function pushFrame(){
  ctx.drawImage(live,crop.sx,crop.sy,crop.sw,crop.sh,0,0,crop.cw,crop.ch);
  if(rec.track.requestFrame) rec.track.requestFrame();
}
function handleFrame(idx){
  if(rec.last!==null&&idx-rec.last<rec.plan.n) return;
  rec.last=idx; rec.frames++; pushFrame();
  if(rec.fps<=8) dot.animate([{transform:'scale(1.7)',opacity:1},{transform:'scale(1)',opacity:.45}],{duration:240});
}
function pickMime(){
  return ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm',
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
}
async function lockScreen(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{if(wake)wake.release()}catch(e){}wake=null}

function startRecording(){
  if(state!=='live'||!stream||!live.videoWidth) return;
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('This browser cannot record videos here.');return}
  const p=plan(target);
  crop=computeCrop(); canvas.width=crop.cw; canvas.height=crop.ch;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,crop.cw,crop.ch);
  let cs=canvas.captureStream(0), track=cs.getVideoTracks()[0];
  if(typeof track.requestFrame!=='function'){cs=canvas.captureStream();track=cs.getVideoTracks()[0]}
  const out=new MediaStream([track,...stream.getAudioTracks()]);
  const mime=pickMime();
  const bps=Math.round(Math.min(10e6,Math.max(2e6,8e6*(crop.cw*crop.ch)/(1920*1080))));
  try{recorder=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:bps}:{videoBitsPerSecond:bps})}
  catch(e){toast('Recording could not be started.');return}
  rec={plan:p,fps:p.fps,last:null,frames:0,chunks:[],track,t0:performance.now(),tEnd:0};
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data)};
  recorder.onstop=finishRecording;
  recorder.start(1000);
  state='recording';
  badgeFps.textContent=nf1.format(p.fps)+' fps';
  timerEl.textContent='0:00';
  timerId=setInterval(()=>{timerEl.textContent=fmtTime((performance.now()-rec.t0)/1000)},200);
  lockScreen(); sync();
}
async function stopRecording(){
  if(state!=='recording') return;
  state='stopping'; sync();
  clearInterval(timerId);
  pushFrame();                       // Include the last frame so the duration is accurate.
  rec.tEnd=performance.now();
  await sleep(160);
  try{recorder.stop()}catch(e){finishRecording()}
}
function finishRecording(){
  unlockScreen();
  const chunks=rec.chunks;
  if(!chunks.length){state='live';sync();toast('Recording was too short.');return}
  const type=(recorder&&recorder.mimeType)||chunks[0].type||'video/webm';
  const blob=new Blob(chunks,{type});
  if(lastRec) URL.revokeObjectURL(lastRec.url);
  lastRec={blob,url:URL.createObjectURL(blob),duration:(rec.tEnd-rec.t0)/1000,fps:rec.fps,n:rec.plan.n,type};
  // Thumbnail for the playback button
  const tc=document.createElement('canvas'); tc.width=tc.height=112;
  const s=Math.min(canvas.width,canvas.height);
  tc.getContext('2d').drawImage(canvas,(canvas.width-s)/2,(canvas.height-s)/2,s,s,0,0,112,112);
  thumbBtn.style.backgroundImage=`url(${tc.toDataURL('image/jpeg',.7)})`;
  thumbBtn.classList.add('has');
  thumbBtn.animate([{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
  state='live'; rec=null; recorder=null; sync();
}

/* ---------- Playback (real time) ---------- */
let hideT=0, dragging=false;
const dur=()=>isFinite(player.duration)&&player.duration>0?player.duration:(lastRec?lastRec.duration:0);
function showUI(){
  pv.classList.add('show'); clearTimeout(hideT);
  if(!player.paused&&!player.ended) hideT=setTimeout(()=>pv.classList.remove('show'),2800);
}
function syncPP(){
  const playing=!player.paused&&!player.ended;
  $('icoPlay').hidden=playing; $('icoPause').hidden=!playing;
  ppBtn.setAttribute('aria-label',playing?'Pause':'Playback');
}
function updateSeek(){
  const d=dur(), t=player.currentTime||0;
  tCur.textContent=fmtTime(t); tDur.textContent=fmtTime(d);
  if(!dragging){const v=d?Math.min(1,t/d):0;seek.value=v*1000;seek.style.setProperty('--p',(v*100)+'%')}
}
function waitFor(el,ev){return new Promise(r=>el.addEventListener(ev,r,{once:true}))}
async function fixDuration(){
  // MediaRecorder files often initially report no duration.
  if(isFinite(player.duration)) return;
  await new Promise(res=>{
    const on=()=>{if(isFinite(player.duration)){player.removeEventListener('timeupdate',on);res()}};
    player.addEventListener('timeupdate',on);
    player.currentTime=1e7;
    setTimeout(res,2500);
  });
  player.currentTime=0;
}
async function openPlayer(){
  if(!lastRec||state!=='live') return;
  state='playback'; pv.hidden=false; pv.classList.add('show');
  pInfo.innerHTML=`<span>${nf1.format(lastRec.fps)} fps</span> · ${fmtTime(lastRec.duration)}`;
  if(player.dataset.url!==lastRec.url){
    player.dataset.url=lastRec.url; player.src=lastRec.url; player.load();
    if(player.readyState<1) await waitFor(player,'loadedmetadata');
    await fixDuration();
  }
  player.currentTime=0; updateSeek(); syncPP();
  try{await player.play()}catch(e){}
  syncPP(); showUI();
}
function closePlayer(){
  player.pause(); pv.hidden=true; state='live'; previewLast=null; sync();
}
function togglePlay(){
  if(player.paused||player.ended){
    if(player.ended||player.currentTime>=dur()-0.05) player.currentTime=0;
    player.play().catch(()=>{});
  }else player.pause();
}
function saveVideo(){
  if(!lastRec) return;
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const ext=lastRec.type.startsWith('video/mp4')?'mp4':'webm';
  const a=document.createElement('a');
  a.href=lastRec.url;
  a.download=`recording-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${nf1.format(lastRec.fps).replace('.','_')}fps.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
}
(function tick(){ if(state==='playback') updateSeek(); requestAnimationFrame(tick) })();

/* ---------- Events ---------- */
recBtn.addEventListener('click',()=>state==='recording'?stopRecording():startRecording());
thumbBtn.addEventListener('click',openPlayer);
flipBtn.addEventListener('click',flipCamera);
fpsBtn.addEventListener('click',()=>{sheet.hidden=false;$('sheetClose').focus()});
$('sheetClose').addEventListener('click',()=>{sheet.hidden=true;fpsBtn.focus()});
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});
fpsRange.addEventListener('input',()=>setTarget(+fpsRange.value));
$('decBtn').addEventListener('click',()=>setTarget(target-1));
$('incBtn').addEventListener('click',()=>setTarget(target+1));
[1,5,10,15,24,30].forEach(v=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.fps=v; b.textContent=v; b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>setTarget(v)); presetsEl.appendChild(b);
});
gateBtn.addEventListener('click',()=>initCamera());

$('pClose').addEventListener('click',closePlayer);
$('pSave').addEventListener('click',saveVideo);
ppBtn.addEventListener('click',()=>{togglePlay();showUI()});
player.addEventListener('click',()=>{pv.classList.contains('show')&&!player.paused?pv.classList.remove('show'):showUI()});
['play','pause','ended'].forEach(ev=>player.addEventListener(ev,()=>{syncPP();showUI()}));
seek.addEventListener('pointerdown',()=>dragging=true);
['pointerup','pointercancel'].forEach(ev=>seek.addEventListener(ev,()=>dragging=false));
seek.addEventListener('input',()=>{
  const v=+seek.value/1000; seek.style.setProperty('--p',(v*100)+'%');
  player.currentTime=v*dur(); showUI();
});

addEventListener('keydown',e=>{
  if(e.code==='Escape'){
    if(!sheet.hidden) sheet.hidden=true; else if(state==='playback') closePlayer();
  }else if(e.code==='Space'&&e.target===document.body){
    e.preventDefault();
    if(state==='playback') togglePlay();
    else if(state==='live'||state==='recording') recBtn.click();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&state==='live'&&vtrack&&vtrack.readyState==='ended') initCamera();
});

updateFpsUI(); sync();
initCamera();
})();
</script>
</body>
</html>
